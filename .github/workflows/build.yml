name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Build with Ant/Gradle direct
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        mkdir -p $ANDROID_HOME
        cd app
        javac -version
        echo "Checking source files..."
        ls -R src/
    
    - name: Simple Build fallback
      run: |
        echo "Creating basic build structure"
        mkdir -p build/outputs/apk/debug/
        # נבצע יצירת קובץ דמה או נראה היכן הבעיה הספציפית אם תרצה
